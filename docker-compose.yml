services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Bound to loopback ONLY. This used to be "5432:5432", i.e. 0.0.0.0 —
      # anyone who could reach the kasa over the tailnet or the venue LAN
      # could `psql -h <kasa> -U pos` with the credentials below and read or
      # write every table directly, bypassing every requireRole() in the app
      # (including staff.pin_visible). The app itself does NOT need this
      # mapping: it talks to the db over the compose network as db:5432.
      # Keep it only so a maintainer can psql from the kasa console itself.
      #
      # TODO(owner, manual): the pos/pos password is still the initdb one and
      # is now known to have been committed. Rotate it on the kasa with
      #   docker exec pos-db-1 psql -U pos -d pos -c "ALTER USER pos PASSWORD '<new>'"
      # then update DATABASE_URL below and in server/.env. It cannot be
      # rotated by editing POSTGRES_PASSWORD here — that only applies on a
      # fresh initdb, and the pg_data volume already exists.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      # Bind on standard HTTP/HTTPS ports too — admin owner types just
      # http://100.95.64.38 in the browser without remembering :3080.
      # POS is a PWA installed via manifest start_url that already pins
      # the port, so it kept working; admin is opened ad-hoc in a tab.
      # Verified nothing else listens on :80 / :443 on the kasa.
      - "80:3080"
      - "443:3443"
      - "3080:3080"
      - "3443:3443"
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://pos:pos@db:5432/pos
      PORT: "3080"
      # Where the daily 04:00 pg_dump writes. Lives on a named volume so
      # backups survive container rebuilds; see ./server/lib/backup.js.
      BACKUP_DIR: /backups
      # Portos na tom istom PC ako Docker: nechaj predvolené. Ak Portos beží na INOM PC, vytvor .env vedľa tohto súboru:
      #   PORTOS_BASE_URL=http://IP_TOHO_PC:3010
      # Premenná sa berie pri `docker compose up` z koreňového .env alebo z prostredia; server/.env ju pre tento kľúč v kontajneri prepíše compose.
      PORTOS_BASE_URL: ${PORTOS_BASE_URL:-http://host.docker.internal:3010}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Daily pg_dump output. Mount into the container at the path
      # BACKUP_DIR points to. Named volume keeps the files outside the
      # image and across `compose down/up` cycles; on the host they live
      # under /var/lib/docker/volumes/ (inspect with `docker volume inspect pos_backups`).
      - pos_backups:/backups
      # Fotky produktov nahrané cez admin (POST /api/menu/items/:id/image).
      # Zapisovali sa do súborového systému kontajnera, takže KAŽDÝ
      # `docker compose up -d --build` ich zmazal a v menu ostali rozbité
      # obrázky. Named volume ich udrží cez rebuildy.
      - pos_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  pos_backups:
  pos_uploads:
