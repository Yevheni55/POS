<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDS - Kuchynsky Display</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/a11y.css">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="/components/confirm.js"></script>
<link rel="stylesheet" href="/css/kitchen.css">
</head>
<body>
<a href="#grid" class="skip-link">Preskocit na objednavky</a>

<div class="bg-scene">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<header class="header" id="header">
  <div class="header-left">
    <button class="view-btn active-kuchyna" id="btnKuchyna" onclick="setView('kuchyna')">KUCHYNA</button>
    <button class="view-btn inactive" id="btnBar" onclick="setView('bar')">BAR</button>
    <button class="view-btn inactive" id="btnRozvoz" onclick="setView('rozvoz')">ROZVOZ<span class="view-badge" id="onlineBadge" hidden>0</span></button>
  </div>
  <div class="header-center" id="clock">00:00:00</div>
  <div class="header-right">
    <div class="order-badge pause-badge" id="ooPauseBadge" hidden aria-live="polite">PAUZA do <span id="ooPauseUntil"></span></div>
    <div class="order-badge" aria-live="polite">Objednavky: <span id="orderCount">0</span></div>
    <button class="sound-btn on" id="soundBtn" onclick="toggleSound()">Zvuk: ZAP</button>
  </div>
</header>

<main class="main">
  <div class="grid" id="grid"></div>
</main>

<!-- Zvuk je v prehliadači zamknutý, kým sa obrazovky nikto nedotkne (js/oo-alarm.js). -->
<div class="kds-gate" id="ooAudioGate" hidden>
  <div class="kds-gate-box">
    <div class="kds-gate-title">Klepnite pre zapnutie zvuku</div>
    <div class="kds-gate-sub">Prehliadač nepustí zvuk bez dotyku. Po klepnutí budú nové objednávky pípať a obrazovka nezhasne.</div>
  </div>
</div>
<!-- Nová online objednávka cez celú obrazovku — kým ju niekto neprijme, neodmietne alebo neodloží. -->
<div class="oo-takeover" id="ooTakeover" hidden role="dialog" aria-modal="true" aria-labelledby="ooTakeoverTitle"></div>
<!-- Odmietnutie online objednávky: dôvod uvidí zákazník na webe. -->
<div class="kds-sheet-overlay" id="ooReject" hidden>
  <div class="kds-sheet" role="dialog" aria-modal="true" aria-labelledby="ooRejectTitle">
    <h2 id="ooRejectTitle">Odmietnuť objednávku <span id="ooRejectCode"></span></h2>
    <p class="kds-sheet-sub">Zákazník uvidí dôvod na webe. Nič sa nevarí, kuriér sa neobjedná.</p>
    <div class="kds-reasons">
      <button type="button" class="kds-reason" data-reason="Dnes už nevaríme">Dnes už nevaríme</button>
      <button type="button" class="kds-reason" data-reason="Niektorá položka je vypredaná">Vypredané</button>
      <button type="button" class="kds-reason" data-reason="Adresa je mimo doručovacej zóny">Mimo zóny</button>
      <button type="button" class="kds-reason" data-reason="Kuchyňa je preťažená, skúste neskôr">Preťažená kuchyňa</button>
    </div>
    <label class="kds-label" for="ooRejectText">Dôvod (môžete upraviť)</label>
    <input id="ooRejectText" class="kds-input" maxlength="300" autocomplete="off">
    <div class="kds-sheet-actions">
      <button type="button" class="btn-per-item" id="ooRejectCancel">Späť</button>
      <button type="button" class="btn-reject-confirm" id="ooRejectOk">Odmietnuť</button>
    </div>
  </div>
</div>
<div class="kds-toast" id="ooToast" role="status" aria-live="polite" hidden></div>

<iframe id="printFrame" class="print-frame"></iframe>

<!-- .min varianta: 47 kB namiesto 156 kB, rovnaka funkcionalita. -->
<script src="/socket.io/socket.io.min.js"></script>
<script src="/js/pos-escape.js"></script>
<script src="/js/oo-alarm.js"></script>
<script src="/js/kitchen.js"></script>
</body>
</html>
