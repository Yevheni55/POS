name: Android tablet — build APK

# Compiles the native tablet app (android-tablet/, Kotlin + Compose) and
# uploads the debug APK — the same variant the kasa distributes through the
# in-app auto-update channel (see android-tablet/README.md).
#
# The Gradle wrapper jar is not committed (android-tablet/gradle/wrapper holds
# only gradle-wrapper.properties), so the build bootstraps `gradlew` first —
# same two commands as the README's "Build z príkazového riadku" section.
#
# checkDesignTokens (wired into `check`) guards the ui/ design-token rules
# described in CLAUDE.md, so it runs together with the build.

on:
  push:
    branches: [main]
    paths:
      - 'android-tablet/**'
      - '.github/workflows/android-tablet.yml'
  pull_request:
    paths:
      - 'android-tablet/**'
      - '.github/workflows/android-tablet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug + checkDesignTokens
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android-tablet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bootstrap gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build debug APK + design-token guard
        run: ./gradlew :app:assembleDebug :app:checkDesignTokens --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-tablet-debug
          path: android-tablet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
